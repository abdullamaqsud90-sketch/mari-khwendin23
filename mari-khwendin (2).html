<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070709;--card:#111115;--surf:#18181f;--bd:#23232e;--tx:#f4f4f5;--mu:#8e8e9c;--mint:#00E599;--acc:#00E599;--bad:#ff6b7a;--badbg:rgba(255,107,122,.12);--okbg:rgba(0,229,153,.12);--warn:#ffb020;--fs:16px}
body.light{--bg:#eef0f3;--card:#fff;--surf:#f4f6f9;--bd:#dfe3e9;--tx:#111115;--mu:#5d6572;--acc:#007a52;--bad:#c81e35;--badbg:rgba(200,30,53,.09);--okbg:rgba(0,150,100,.1);--warn:#a86400}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:var(--fs);line-height:1.75;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#app{display:flex;height:100%}
aside{width:264px;flex-shrink:0;background:#0d0d11;border-inline-end:1px solid #23232e;display:flex;flex-direction:column;justify-content:space-between;z-index:30;color:#f4f4f5}
.brand{display:flex;gap:12px;align-items:center;padding:22px 20px;border-bottom:1px solid #23232e}
.logo{width:40px;height:40px;border-radius:12px;background:#070709;border:1px solid #23232e;display:grid;place-items:center;color:#00E599}
.brand b{font-weight:900;font-size:1.05rem;display:block;line-height:1.3}
.brand small{color:#8e8e9c;font-size:.7rem}
#nav{padding:14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
.nb{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:12px;border:0;background:none;color:#8e8e9c;font-weight:600;font-size:.9rem;cursor:pointer;text-align:start}
.nb:hover{background:#18181f;color:#fff}
.nb.on{background:var(--mint);color:#06110c;font-weight:800}
.nb svg{width:20px;height:20px;flex-shrink:0}
.sfoot{padding:16px 20px;border-top:1px solid #23232e;font-size:.78rem;color:#8e8e9c;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#555;flex-shrink:0}
.dot.on{background:var(--mint)}
main{flex:1;min-width:0;overflow-y:auto;position:relative}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 24px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
header h1{font-size:.95rem;margin:0;font-weight:700;color:var(--mu);flex:1}
.ib{display:none;border:1px solid var(--bd);background:var(--surf);border-radius:10px;width:40px;height:40px;place-items:center;cursor:pointer}
#chip{font-size:.8rem;font-weight:700;color:var(--acc);background:var(--okbg);padding:4px 12px;border-radius:99px;cursor:pointer}
#chip:empty{display:none}
#view{max-width:980px;margin:0 auto;padding:28px 24px calc(60px + env(safe-area-inset-bottom,0px))}
#scrim{display:none}
h2.h{font-size:1.6rem;font-weight:900;margin:0 0 6px;line-height:1.4}
h3{font-size:1.05rem;margin:0 0 12px;font-weight:800}
.mu{color:var(--mu)}
.sm{font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin:18px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:12px;border:1px solid var(--mint);background:var(--mint);color:#06110c;font-weight:800;cursor:pointer;font-size:.92rem}
.btn:hover{filter:brightness(.93)}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 14px;font-size:.8rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:7px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--surf);cursor:pointer;font-weight:600;font-size:.88rem}
.chip:hover{border-color:var(--mint)}
.chip.on{background:var(--okbg);border-color:var(--mint);color:var(--acc);font-weight:800}
.lbl{font-weight:700;font-size:.85rem;color:var(--mu);margin-top:18px}
label{display:block;font-size:.85rem;font-weight:600;color:var(--mu);margin-bottom:12px}
input[type=text],input[type=number],input[type=password],input[type=file],input[type=date],select,textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--surf);color:var(--tx)}
input[type=number]{width:110px}
textarea{resize:vertical}
details{margin-top:14px}summary{cursor:pointer;color:var(--acc);font-weight:700;font-size:.9rem}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--bd);border-radius:18px;background:var(--card);overflow:hidden;margin:20px 0}
.stats>div{padding:18px 20px;border-inline-end:1px solid var(--bd)}
.stats>div:last-child{border:0}
.stats b{display:block;font-size:1.7rem;font-weight:900;line-height:1.3}
.stats span{font-size:.8rem;color:var(--mu);font-weight:600}
.item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 10px;border-radius:99px;background:var(--surf);border:1px solid var(--bd);color:var(--mu);margin-inline-end:6px}
.badge.g{color:var(--acc);border-color:var(--mint)}
.badge.w{color:var(--warn);border-color:var(--warn)}
.warn{color:var(--warn);font-size:.82rem;font-weight:600}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.steps li:last-child{border:0}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.75rem;flex-shrink:0}
.tick.ok{background:var(--mint);border-color:var(--mint);color:#06110c;font-weight:900}
.bar{height:8px;border-radius:99px;background:var(--surf);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.qbox{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:26px;margin-top:16px}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.9;margin:10px 0 20px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;padding:13px 16px;margin-bottom:10px;border-radius:14px;border:1px solid var(--bd);background:var(--surf);cursor:pointer;font-weight:600;font-size:.95rem}
.opt:hover:not([disabled]){border-color:var(--mint)}
.opt b{flex-shrink:0;width:26px;height:26px;border-radius:8px;border:1px solid var(--bd);display:grid;place-items:center;font-size:.8rem}
.opt.ok{border-color:var(--mint);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:.92rem}
.fb.ok{background:var(--okbg);border:1px solid var(--mint)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.big{font-size:3.4rem;font-weight:900;line-height:1.2}
.fcw{perspective:1000px;margin-top:20px;cursor:pointer}
.fci{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d}
.fci.flip{transform:rotateY(180deg)}
.fcf{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.2rem;font-weight:700;line-height:1.9;overflow:auto}
.fcf.b{transform:rotateY(180deg);background:var(--surf);border-color:var(--mint);font-size:1.05rem;font-weight:600}
.tm{position:relative;width:min(300px,80vw);margin:24px auto}
.tm svg{width:100%;display:block;transform:rotate(-90deg)}
.tm .trk{fill:none;stroke:var(--bd);stroke-width:8}
.tm .prg{fill:none;stroke:var(--mint);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tt span{font-size:3.2rem;font-weight:900;direction:ltr;letter-spacing:.02em}
.tt small{color:var(--mu);font-weight:700}
.chat{display:flex;flex-direction:column;gap:12px;margin:16px 0;min-height:200px}
.msg{max-width:88%;padding:12px 16px;border-radius:16px;font-size:.95rem;line-height:1.85;word-break:break-word}
.msg.u{align-self:flex-start;background:var(--mint);color:#06110c;font-weight:600}
.msg.m{align-self:flex-end;background:var(--card);border:1px solid var(--bd)}
.msg.e{border-color:var(--bad);color:var(--bad)}
.cin{display:flex;gap:10px;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:8px}
.cin textarea{margin:0;flex:1}
.wk{display:flex;gap:10px;align-items:flex-end;height:150px;margin:16px 0 4px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:.72rem;color:var(--mu)}
.wk i{display:block;width:100%;max-width:40px;background:var(--mint);border-radius:8px 8px 0 0;min-height:3px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:grid;place-items:center;padding:20px}
.ov[hidden]{display:none}
.bx{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:26px;max-width:460px;width:100%;text-align:center}
.bx.l{text-align:start;max-height:80vh;overflow:auto}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--bd);border-top-color:var(--mint);margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:12px;font-weight:700;font-size:.88rem;z-index:200;max-width:90vw;text-align:center;display:none}
.pre{white-space:pre-wrap;font-size:.85rem;background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:12px;max-height:260px;overflow:auto}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin:12px 0}
.sc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 6px 10px;border-radius:16px;border:2px solid transparent;background:var(--surf);cursor:pointer;font-weight:700;font-size:.82rem;line-height:1.45;text-align:center}
.sc:hover{border-color:var(--bd)}
.sc.on{border-color:var(--mint);background:var(--okbg);color:var(--acc)}
.cw{display:block;width:100%;aspect-ratio:3/4;position:relative;border-radius:9px;overflow:hidden}
.cv1{width:100%;height:100%;object-fit:cover;display:block}
.cv2{position:absolute;inset:0;display:block}
.cv2 img{position:absolute;width:72%;aspect-ratio:3/4;object-fit:cover;border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2)}
.cv2 img:first-child{top:0;inset-inline-end:0}
.cv2 img:last-child{bottom:0;inset-inline-start:0}
.sc.all .cw{display:grid;place-items:center;background:var(--card);border:1px dashed var(--bd);font-weight:800}
.th{display:block;width:42px;aspect-ratio:3/4;position:relative;flex-shrink:0;border-radius:7px;overflow:hidden}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:160px;padding:24px;border-radius:24px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;text-align:start}
.tile:hover{border-color:var(--mint)}
.tile svg{width:40px;height:40px;color:var(--acc);flex-shrink:0}
.tile b{display:block;font-size:1.35rem;font-weight:900;line-height:1.5}
.tile small{display:block;color:var(--mu);font-size:.88rem;font-weight:600;margin-top:2px}
.tile.main{background:var(--mint);border-color:var(--mint);color:#06110c}
.tile.main svg,.tile.main small{color:#06110c}

'use strict';
/* ============ Supabase ============ */
const SB_URL='https://stiecrwbyuzwkqksusgx.supabase.co';
const SB_KEY='sb_publishable_VRF7Twujy20VeRvkKJgErw_6BoHNXPH';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let CU=null; // current user
async function initAuth(){
  const {data:{session}}=await sb.auth.getSession();
  CU=session?.user||null;
  sb.auth.onAuthStateChange(async(_,s)=>{
   const wasNull=!CU;
   CU=s?.user||null;
   if(CU&&wasNull)await loadCloudData();
   side();renderAuth();
  });
}
async function loadCloudData(){
 if(!CU)return;
 try{
  // sessions
  const {data:sess}=await sb.from('sessions').select('*').eq('user_id',CU.id).order('created_at',{ascending:false}).limit(500);
  if(sess?.length){S.sessions=sess.map(x=>({t:new Date(x.created_at).getTime(),kind:x.kind,subject:x.subject,total:x.total,correct:x.correct,secs:x.secs}));save('sessions')}
  // wrongs
  const {data:wr}=await sb.from('wrong_answers').select('*').eq('user_id',CU.id);
  if(wr?.length){S.wrongs=wr.map(x=>({id:x.id,subject:x.subject,q:x.q,options:x.options||[],answer:x.answer,answerText:x.answer_text||'',year:x.year,n:x.n,at:new Date(x.updated_at).getTime()}));save('wrongs')}
  // seen
  const {data:sn}=await sb.from('seen_questions').select('question_id,seen_at').eq('user_id',CU.id);
  if(sn?.length){sn.forEach(x=>S.seen[x.question_id]=new Date(x.seen_at).getTime());save('seen')}
  // profile name
  const {data:pr}=await sb.from('profiles').select('name').eq('id',CU.id).single();
  if(pr?.name){S.settings.name=pr.name;save('settings')}
 }catch(e){console.warn('cloud load',e)}
}
async function renderAuth(){
  if(CU){if(U.tab==='auth')go('dashboard');side();render()}
  else{go('auth');render()}
}

/* ============ هەڵگرتنی داتا (IndexedDB) ============ */
let _db,memMode=false;const MEM={kv:new Map(),blobs:new Map()};
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('mari-khwendin',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('blobs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function tx(store,mode,fn){
 if(memMode)return null;
 const d=await idb();
 return new Promise((res,rej)=>{const t=d.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
}
const kvGet=async k=>memMode?MEM.kv.get(k):tx('kv','readonly',s=>s.get(k));
const kvSet=async(k,v)=>memMode?void MEM.kv.set(k,v):tx('kv','readwrite',s=>s.put(v,k));
const kvDel=async k=>memMode?void MEM.kv.delete(k):tx('kv','readwrite',s=>s.delete(k));
const blobGet=async k=>memMode?MEM.blobs.get(k):tx('blobs','readonly',s=>s.get(k));
const blobSet=async(k,v)=>memMode?void MEM.blobs.set(k,v):tx('blobs','readwrite',s=>s.put(v,k));
const blobDel=async k=>memMode?void MEM.blobs.delete(k):tx('blobs','readwrite',s=>s.delete(k));

async function gemini(contents,{system,json,maxTokens=16000,temp=.5}={}){
 const {apiKey,model}=S.settings;
 if(!apiKey)throw new Error(isAdmin()?'کلیلی API لە ڕێکخستنەکان دابنێ.':'AI ئێستا ئامادە نییە.');
 const body={contents,generationConfig:{temperature:temp,maxOutputTokens:maxTokens}};
 if(system)body.systemInstruction={parts:[{text:system}]};
 if(json)body.generationConfig.responseMimeType='application/json';
 let r;
 try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify(body)})}
 catch{throw new Error('پەیوەندی ئینتەرنێت نییە.')}
 if(!r.ok){
  let m='';try{m=(await r.json()).error?.message||''}catch{}
  const c=r.status;
  if(c===429)throw new Error('سنووری بەکارهێنانی خۆڕایی تەواو بوو. دواتر هەوڵ بدەرەوە، یان لە ڕێکخستنەکان مۆدێلێکی تر (Flash-Lite) هەڵبژێرە.');
  if(c===404)throw new Error('ئەم مۆدێلە بەردەست نییە. لە ڕێکخستنەکان «لیستی مۆدێلەکان» دابگرە و یەکێکیان هەڵبژێرە.');
  if((c===400||c===403)&&/key|api/i.test(m))throw new Error('کلیلی API دروست نییە. لە ڕێکخستنەکان پشکنینی بکە.');
  throw new Error('هەڵەی AI ('+c+'): '+m.slice(0,160));
 }
 const d=await r.json();
 const t=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
 if(!t)throw new Error('AI وەڵامێکی نەدایەوە. دووبارە هەوڵ بدەرەوە.');
 return t;
}
const ask=(text,o)=>gemini([{role:'user',parts:[{text}]}],o);
function pj(t){
 t=t.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
 try{return JSON.parse(t)}catch{}
 const a=t.indexOf('['),b=t.lastIndexOf(']'),c=t.lastIndexOf('}');
 if(a>=0&&b>a)try{return JSON.parse(t.slice(a,b+1))}catch{}
 if(a>=0&&c>a)try{return JSON.parse(t.slice(a,c+1)+']')}catch{}
 throw new Error('ئەنجامی AI بە شێوەی دروست نەبوو. دووبارە هەوڵ بدەرەوە.');
}
function normQ(x,subj,ex={}){
 if(!x||typeof x.q!=='string'||x.q.trim().length<5)return null;
 const opts=Array.isArray(x.options)?x.options.map(o=>String(o).trim()).filter(Boolean):[];
 const ans=Number.isInteger(x.answer)?x.answer:null;
 const mcq=opts.length>=2;
 if(mcq&&(ans===null||ans<0||ans>=opts.length))return null;
 if(!mcq&&!String(x.answerText||'').trim())return null;
 return{id:hash(subj+(ex.year||'')+x.q),subject:subj,q:x.q.trim(),options:mcq?opts:[],answer:mcq?ans:null,answerText:String(x.answerText||'').trim(),explain:String(x.explain||'').trim(),page:x.page||null,...ex};
}
function shuffleQ(q){
 if(q.options.length<2||q.options.some(o=>/هەموو|هیچ|هەردوو|all of|none of|both/i.test(o)))return q;
 const idx=shuffle(q.options.map((_,i)=>i));
 return{...q,options:idx.map(i=>q.options[i]),answer:idx.indexOf(q.answer)};
}

async function extractPdf(file,prog){
 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
 const pages=[];
 for(let i=1;i<=pdf.numPages;i++){
  if(job.cancel)throw new Error('وەستێنرا.');
  const p=await pdf.getPage(i);const c=await p.getTextContent();
  pages.push(c.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('').replace(/[ \t]+/g,' ').replace(/\n\s+/g,'\n').trim());
  prog(i,pdf.numPages);
 }
 return pages;
}
function splitText(t){

 for(const para of t.split(/\n\s*\n/)){if((cur+para).length>2500&&cur){out.push(cur.trim());cur=''}cur+=para+'\n\n'}
 if(cur.trim())out.push(cur.trim());
 return out.length?out:[t];
}

async function sourceText(subj,c,maxChars=14000){
 const books=S.books.filter(b=>b.subject===subj&&b.kind!=='ministry'&&(c.book==='all'||b.id===c.book));
 if(!books.length)throw new Error('هێشتا کتێبی «'+sname(subj)+'» ئامادە نەکراوە.');
 const all=[];
 for(const b of books){(await getPages(b.id)).forEach((t,i)=>{const p=i+1;if(t.length>=80&&(!c.from||p>=+c.from)&&(!c.to||p<=+c.to))all.push({b:b.title,p,t})})}
 if(!all.length)throw new Error('لەو پەڕانە هیچ دەقێک نەدۆزرایەوە. پەڕەیەکی تر هەڵبژێرە.');
 const s=Math.floor(Math.random()*all.length);let out='';
 for(let k=0;k<all.length&&out.length<maxChars;k++){const x=all[(s+k)%all.length];out+=`\n[${x.b} - پەڕە ${x.p}]\n${x.t.slice(0,4000)}\n`}
 return out;
}
async function genQuestions(subj,n,c){
 const got=[];const have=new Set(S.aiq.map(q=>q.id));
 for(let round=0;round<4&&got.length<n;round++){
  if(job.cancel)break;
  const need=Math.min(10,n-got.length);
  busyMsg(`AI پرسیار دروست دەکات... (${fa(got.length)} لە ${fa(n)})`,got.length*100/n);
  const src=await sourceText(subj,c);
  const prev=S.aiq.filter(q=>q.subject===subj).slice(-40).map(q=>'- '+q.q.slice(0,90)).join('\n');
  const prompt=`Create ${need} multiple-choice questions for a grade-12 student in the Kurdistan Region of Iraq, subject "${sname(subj)}", based ONLY on the source text below. Write in Kurdish (Sorani, Arabic script); keep scientific terms and formulas as they appear in the source. Each question has exactly 4 options and exactly one correct option, with plausible wrong options, in the style of the ministry exam, with varied difficulty. "answer" is the 0-based index of the correct option. "page" is the page number from the source marker where the answer is found. "explain" is one or two short sentences in Sorani saying why the answer is correct.${prev?`\nDo NOT repeat or rephrase these previously asked questions:\n${prev}`:''}\nReturn ONLY a JSON array: [{"q":"","options":["","","",""],"answer":0,"explain":"","page":0}]\n\nSOURCE:\n${src}`;
  const arr=pj(await ask(prompt,{json:true,temp:.8}));
  for(const x of Array.isArray(arr)?arr:[]){
   const q=normQ(x,subj);if(!q||have.has(q.id))continue;
   have.add(q.id);const f=shuffleQ(q);S.aiq.push(f);got.push(f);if(got.length>=n)break;
  }
  save('aiq');
 }
 return got;
}
async function genCards(subj,n,c){
 const got=[];const deck=S.decks[subj]=S.decks[subj]||[];const have=new Set(deck.map(d=>d.id));
 for(let round=0;round<4&&got.length<n;round++){
  if(job.cancel)break;
  const need=Math.min(15,n-got.length);
  busyMsg(`AI فلاشکارت دروست دەکات... (${fa(got.length)} لە ${fa(n)})`,got.length*100/n);
  const src=await sourceText(subj,c);
  const prev=deck.slice(-60).map(d=>'- '+d.front.slice(0,80)).join('\n');
  const prompt=`Create ${need} study flashcards for a grade-12 student in the Kurdistan Region of Iraq, subject "${sname(subj)}", based ONLY on the source text below. Write in Kurdish (Sorani, Arabic script); keep scientific terms and formulas as in the source. "front" is a short question or term. "back" is a concise, correct answer (1-3 sentences). "page" is the page number from the source marker. Focus on key definitions, laws, formulas, processes and exam-style facts.${prev?`\nDo NOT repeat these existing cards:\n${prev}`:''}\nReturn ONLY a JSON array: [{"front":"","back":"","page":0}]\n\nSOURCE:\n${src}`;
  const arr=pj(await ask(prompt,{json:true,temp:.7}));
  for(const x of Array.isArray(arr)?arr:[]){
   if(!x||typeof x.front!=='string'||typeof x.back!=='string'||x.front.trim().length<2||x.back.trim().length<2)continue;
   const id=hash(subj+x.front);if(have.has(id))continue;
   have.add(id);const d={id,subject:subj,front:x.front.trim(),back:x.back.trim(),page:x.page||null,status:'new'};deck.push(d);got.push(d);if(got.length>=n)break;
  }
  save('decks');
 }
 return got;
}
async function extractMinistry(b){

 pages.forEach((t,i)=>{if((cur+t).length>14000&&cur){chunks.push(cur);cur=''}cur+=`\n[پەڕە ${i+1}]\n${t}\n`});
 if(cur.trim())chunks.push(cur);
 if(!chunks.length)throw new Error('ئەم فایلە هیچ دەقێکی نییە.');
 const have=new Set(S.ministry.map(q=>q.id));let added=0,dropped=0,aiAns=0;
 for(let i=0;i<chunks.length;i++){
  if(job.cancel)break;
  busyMsg(`دەرهێنانی پرسیارەکان... بەشی ${fa(i+1)} لە ${fa(chunks.length)}`,i*100/chunks.length);
  const prompt=`This is extracted text of an exam paper (Iraqi Kurdistan, grade 12, subject "${sname(b.subject)}", year ${b.year}). Extract EVERY exam question present in the text.
Rules:
- Keep each question and option wording EXACTLY as in the text (Kurdish Sorani / Arabic script / English / formulas). Do not translate or rewrite. Fix only obvious extraction spacing errors.
- Multiple choice: "options" = the option texts without their letters. Written/short questions: "options": [] and put the model answer in "answerText".
- "answer" = 0-based index of the correct option. If the document itself gives or marks the answer, set "fromDoc": true. Otherwise choose the most likely correct option yourself and set "fromDoc": false.
- "explain": one short sentence in Kurdish Sorani (optional). "page": page number from the marker.
- Skip headings, instructions and cut-off partial questions.
Return ONLY a JSON array: [{"q":"","options":[],"answer":0,"answerText":"","fromDoc":true,"explain":"","page":0}]

TEXT:
${chunks[i]}`;
  let arr;try{arr=pj(await ask(prompt,{json:true,temp:.1}))}catch(e){save('ministry');throw new Error(e.message+' (ئەوەی تا ئێستا دۆزرایەوە هەڵگیرا.)')}
  for(const x of Array.isArray(arr)?arr:[]){
   const q=normQ(x,b.subject,{year:b.year,bookId:b.id,src:x.fromDoc===false?'ai':'doc'});
   if(!q){dropped++;continue}if(have.has(q.id))continue;
   have.add(q.id);S.ministry.push(q);added++;if(q.src==='ai'&&q.options.length)aiAns++;
  }
  save('ministry');
 }
 return{added,dropped,aiAns};
}
async function retrieve(subj,q){
 const toks=[...new Set((q.toLowerCase().match(/[\p{L}\p{N}]{3,}/gu)||[]))];
 if(!toks.length)return'';
 const cand=[];
 for(const b of S.books.filter(b=>b.subject===subj&&b.kind!=='ministry')){
  (await getPages(b.id)).forEach((t,i)=>{
   const L=t.toLowerCase();let sc=0;
   for(const w of toks){let idx=-1,c=0;while((idx=L.indexOf(w,idx+1))>=0&&c<5)c++;sc+=c}
   if(sc>0)cand.push({sc,b:b.title,p:i+1,t});
  });
 }
 cand.sort((a,b)=>b.sc-a.sc);
 return cand.slice(0,4).map(x=>`[${x.b} - پەڕە ${x.p}]\n${x.t.slice(0,3000)}`).join('\n\n');
}

 return`<h2 class="h">کویز</h2><p class="mu">بابەت و ژمارەی پرسیار هەڵبژێرە. هەر جارێک پرسیاری نوێ پێشان دەدرێت و دووبارە نابێتەوە تا هەموو پرسیارەکان تەواو دەبن.</p>

function quizRun(){
 const r=U.run,q=r.list[r.i],total=r.list.length;
 const isMcq=q.options.length>=2;
 let body='';
 if(isMcq){
  body=q.options.map((o,i)=>{
   let cls='';if(r.sel!==null){if(i===q.answer)cls=' ok';else if(i===r.sel)cls=' no'}
   return`<button class="opt${cls}" data-a="pick" data-i="${i}" ${r.sel!==null?'disabled':''}><b>${LET[i]||i+1}</b><span dir="auto">${esc(o)}</span></button>`;
  }).join('');
  if(r.sel!==null){
   const ok=r.sel===q.answer;
   body+=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'ڕاستە!':'هەڵەیە.'}</b> ${ok?'':`وەڵامی ڕاست: <b dir="auto">${esc(q.options[q.answer])}</b>.`}${q.explain?`<div style="margin-top:6px" dir="auto">${esc(q.explain)}</div>`:''}${q.page?`<div class="sm mu" style="margin-top:6px">سەرچاوە: پەڕەی ${fa(q.page)}</div>`:''}${q.src==='ai'?`<div class="warn" style="margin-top:6px">ئەم وەڵامە لەلایەن AI دیاری کراوە و لە فایلەکەدا نەبوو. لەگەڵ سەرچاوەکە بەراوردی بکە.</div>`:''}</div>`;
  }
 }else{
  if(!r.shown)body=`<button class="btn ghost" data-a="reveal">وەڵامەکە پیشان بدە</button>`;
  else if(r.sel===null)body=`<div class="fb ok" dir="auto"><b>وەڵام:</b><div style="margin-top:6px;white-space:pre-wrap">${esc(q.answerText)}</div></div><div class="row" style="margin-top:12px"><button class="btn" data-a="selfGrade" data-v="1">وەڵامم ڕاست بوو</button><button class="btn bad" data-a="selfGrade" data-v="0">هەڵە بوو</button></div>`;
  else body=`<div class="fb ${r.sel===1?'ok':'no'}" dir="auto"><b>وەڵام:</b><div style="margin-top:6px;white-space:pre-wrap">${esc(q.answerText)}</div></div>`;
 }
 const answered=r.sel!==null;
 return`<div class="row"><button class="btn ghost sm" data-a="quitRun">داخستن</button><span class="grow"></span><span class="badge g">${sname(r.subj)}</span><span class="badge">پرسیاری ${fa(r.i+1)} لە ${fa(total)}</span></div>
 <div class="bar" style="margin-top:12px"><i style="width:${(r.i+(answered?1:0))*100/total}%"></i></div>
 <div class="qbox">${q.year?`<span class="badge">وەزاری ${fa(q.year)}</span>`:''}${!q.year&&r.mode==='ai'?'<span class="badge">دروستکراو بە AI</span>':''}
 <div class="qtext" dir="auto">${fmtQ(q.q)}</div>${body}
 ${answered?`<div style="margin-top:18px"><button class="btn" data-a="nextQ">${r.i+1<total?'پرسیاری دواتر':'بینینی ئەنجام'}</button></div>`:''}</div>`;
}
function quizDone(){
 const r=U.run,ok=r.res.filter(x=>x.ok).length,tot=r.list.length,p=Math.round(ok*100/tot);
 const bad=r.res.filter(x=>!x.ok).map(x=>r.list.find(q=>q.id===x.id)).filter(Boolean);
 return`<h2 class="h">ئەنجامی کویز</h2>
 <section class="panel" style="text-align:center"><div class="big">${fa(ok)} / ${fa(tot)}</div><p class="mu" style="margin:4px 0 16px">${fa(p)}٪ ${p>=85?'، زۆر باش!':p>=60?'، باشە، بەردەوام بە.':'، پێویستە دووبارە بیخوێنیتەوە.'}</p>
 <div class="row" style="justify-content:center"><button class="btn" data-a="newQuiz">کویزی نوێ</button>${bad.length?`<button class="btn ghost" data-a="retryBad">هەڵەکان دووبارە بکەوە</button>`:''}</div></section>
 ${bad.length?`<section class="panel"><h3>ئەو پرسیارانەی هەڵەت تێدا کرد</h3>${bad.map(q=>`<div class="item"><div class="grow" dir="auto"><div style="font-weight:700">${fmtQ(q.q)}</div><div class="sm" style="margin-top:4px;color:var(--acc)">${q.options.length?esc(q.options[q.answer]):esc(q.answerText)}</div></div></div>`).join('')}</section>`:''}`;
}

V.stats=()=>{
 const st=stats();
 if(!S.sessions.length)return`<h2 class="h">ئامار و تۆمار</h2><section class="panel"><p class="mu">هێشتا هیچ تۆمارێک نییە. کویزێک بکە یان تایمەری فۆکەس دەستپێبکە.</p><button class="btn" data-a="go" data-t="quiz">دەستپێکردنی کویز</button></section>`;
 const rows=SUBJ.map(s=>{
  const q=S.sessions.filter(x=>x.kind==='quiz'&&x.subject===s.id);
  const t=q.reduce((a,x)=>a+x.total,0),c=q.reduce((a,x)=>a+x.correct,0);
  const secs=S.sessions.filter(x=>x.subject===s.id).reduce((a,x)=>a+(x.secs||0),0);
  return{s,t,p:t?Math.round(c*100/t):null,secs};
 });
 const now=new Date();const days=[];
 for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const a=d.getTime(),b=a+864e5;days.push({n:DAYS[d.getDay()],m:S.sessions.filter(x=>x.t>=a&&x.t<b).reduce((q,x)=>q+(x.secs||0),0)/60})}
 const mx=Math.max(...days.map(d=>d.m),1);
 const kl={quiz:'کویز',cards:'فلاشکارت',focus:'فۆکەس'};
 return`<h2 class="h">ئامار و تۆمار</h2>
 <div class="stats"><div><b>${st.acc===null?'—':fa(st.acc)+'٪'}</b><span>ڕێژەی وەڵامی ڕاست (${fa(st.qs)} پرسیار)</span></div><div><b>${fa(st.hours.toFixed(1))}</b><span>کاتژمێری خوێندن</span></div><div><b>${fa(st.quizzes)}</b><span>کویزی تەواوکراو</span></div></div>
 <section class="panel"><h3>٧ ڕۆژی دوایی (خولەک)</h3><div class="wk">${days.map(d=>`<div><span>${fa(Math.round(d.m))}</span><i style="height:${Math.max(3,d.m*100/mx)}%"></i>${d.n}</div>`).join('')}</div></section>
 <section class="panel"><h3>بەپێی بابەت</h3>${rows.map(r=>`<div class="item">${thumb(r.s)}<div class="grow"><b>${r.s.name}</b><div class="sm mu">${fa((r.secs/3600).toFixed(1))} کاتژمێر · ${fa(r.t)} پرسیار</div><div class="bar" style="margin-top:6px"><i style="width:${r.p||0}%"></i></div></div><b>${r.p===null?'—':fa(r.p)+'٪'}</b></div>`).join('')}</section>
 <section class="panel"><h3>دوایین تۆمارەکان</h3>${S.sessions.slice(-8).reverse().map(x=>`<div class="item"><div class="grow"><b>${kl[x.kind]||x.kind}</b> <span class="badge">${sname(x.subject)}</span></div><span class="sm mu">${x.kind==='quiz'?fa(x.correct)+' / '+fa(x.total)+' · ':''}${fa(Math.round((x.secs||0)/60))} خولەک · ${fa(new Date(x.t).toLocaleDateString('en-GB'))}</span></div>`).join('')}</section>`;
};

const mmss=s=>fa(String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')).replace('٫',':');
V.timer=()=>{
 const foc=T.mode==='focus';
 return`<h2 class="h">تایمەری فۆکەس</h2><p class="mu">بە تەکنیکی پۆمۆدۆرۆ: کاتێکی دیاریکراو بخوێنە، پاشان پشووێک بدە. کاتی فۆکەس لە ئامارەکەتدا تۆمار دەکرێت.</p>
 <div class="chips" style="justify-content:center">${[[15,'focus'],[25,'focus'],[45,'focus'],[5,'break'],[10,'break']].map(([m,k])=>`<button class="chip${T.mode===k&&(k==='focus'?T.f:T.b)===m?' on':''}" data-a="tset" data-m="${k}" data-v="${m}">${fa(m)} خولەک ${k==='focus'?'فۆکەس':'پشوو'}</button>`).join('')}</div>
 <div class="row" style="justify-content:center;gap:20px;margin-top:8px">
  <label style="display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;color:var(--mu)">دەستی — فۆکەس<input type="number" min="1" max="180" value="${T.f}" data-m="focus" onchange="A.tcustom(this)" style="width:68px;margin:0;text-align:center" dir="ltr"> خولەک</label>
  <label style="display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;color:var(--mu)">پشوو<input type="number" min="1" max="60" value="${T.b}" data-m="break" onchange="A.tcustom(this)" style="width:68px;margin:0;text-align:center" dir="ltr"> خولەک</label>
 </div>
 <div class="tm"><svg viewBox="0 0 220 220"><circle class="trk" r="100" cx="110" cy="110"/><circle class="prg" id="tr" r="100" cx="110" cy="110" stroke-dasharray="628.3" stroke-dashoffset="${628.3*(1-T.left/T.total)}"/></svg><div class="tt"><span id="tm">${mmss(T.left)}</span><small id="tl">${foc?'فۆکەس':'پشوو'}</small></div></div>

function tUI(){
 const a=$('#tm');if(a){a.textContent=mmss(T.left);$('#tr').setAttribute('stroke-dashoffset',628.3*(1-T.left/T.total))}
 const c=$('#chip');c.textContent=T.run||T.left<T.total?(T.mode==='focus'?'فۆکەس ':'پشوو ')+mmss(T.left):'';
}
function tTick(){
 T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));tUI();
 if(T.left<=0)tDone();
}
function beep(){if(S.settings.sound===false)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.2);o.start();o.stop(a.currentTime+1.2)}catch{}}
function tLog(){const el=T.total-T.left;if(T.mode==='focus'&&el>=60)logSession({kind:'focus',subject:T.subj,secs:el})}
function tDone(){
 clearInterval(T.iv);T.run=false;beep();tLog();
 toast(T.mode==='focus'?'کاتی فۆکەس تەواو بوو. پشوویەک بدە.':'پشوو تەواو بوو.');
 T.mode=T.mode==='focus'?'break':'focus';T.total=(T.mode==='focus'?T.f:T.b)*60;T.left=T.total;
 if(U.tab==='timer')render();else tUI();
}

function ttl(kind,fb){const t=$('#lt').value.trim();if(t)return t;const lb=$('#lb');return kind==='book'&&lb?lb.value:fb}
A.addFile=async()=>{
 const f=$('#lf').files[0];if(!f)return toast('سەرەتا فایلێک هەڵبژێرە.');
 const kind=$('#lk').value,year=+$('#ly').value||null;
 if(kind==='ministry'&&!year)return toast('ساڵی پرسیارەکان بنووسە.');
 const title=ttl(kind,f.name.replace(/\.[^.]+$/,''));
 busyOn('خوێندنەوەی فایل...');
 try{
  let pages,blob=null;
  if(/\.pdf$/i.test(f.name)){await loadPdf();pages=await extractPdf(f,(i,n)=>busyMsg(`خوێندنەوەی پەڕەی ${fa(i)} لە ${fa(n)}`,i*100/n));blob=f}
  else pages=splitText(await f.text());
  const b=await saveBook({subject:U.lib.subj,kind,title,year:kind==='ministry'?year:null},pages,blob);
  busyOff();render();
  if(b.chars<200)toast('هیچ دەقێک نەدۆزرایەوە. ڕەنگە PDFەکە وێنە بێت؛ OCR بکە.');
  else if(b.empty>0)toast(`${fa(b.empty)} پەڕە دەقیان نییە. OCR بکە بۆ ئەوانە.`);
  else toast('فایلەکە زیاد کرا.'+(kind==='ministry'?' ئێستا پرسیارەکانی دەربهێنە.':''));
 }catch(e){busyOff();toast(e.message)}
};
A.addPaste=async()=>{
 const t=$('#lp').value.trim();if(t.length<50)return toast('دەقێکی درێژتر بچەسپێنە.');
 const kind=$('#lk').value,year=+$('#ly').value||null;
 if(kind==='ministry'&&!year)return toast('ساڵی پرسیارەکان بنووسە.');
 await saveBook({subject:U.lib.subj,kind,title:ttl(kind,'دەقی لکێنراو'),year:kind==='ministry'?year:null},splitText(t),null);
 render();toast('زیاد کرا.');
};
A.delBook=async el=>{

 S.books=S.books.filter(x=>x.id!==b.id);S.ministry=S.ministry.filter(q=>q.bookId!==b.id);
 delete PG[b.id];await kvDel('pages:'+b.id);await blobDel(b.id).catch(()=>{});
 save('books');save('ministry');render();

A.extractQ=async el=>{
 const b=S.books.find(x=>x.id===el.dataset.id);
 busyOn('دەستپێکردن...');
 try{const r=await extractMinistry(b);busyOff();render();toast(`${fa(r.added)} پرسیار زیاد کرا.${r.aiAns?` ${fa(r.aiAns)}یان وەڵامەکەیان لەلایەن AI دیاری کراوە.`:''}${r.dropped?` ${fa(r.dropped)} پرسیاری ناتەواو بەجێهێڵران.`:''}`)}
 catch(e){busyOff();render();toast(e.message)}

A.ocr=async el=>{
 const b=S.books.find(x=>x.id===el.dataset.id),blob=await blobGet(b.id);
 if(!blob)return toast('فایلی PDFی ئەسڵی نەماوە.');
 const pages=await getPages(b.id),todo=pages.map((t,i)=>t.length<25?i:-1).filter(i=>i>=0).slice(0,15);
 busyOn('ئامادەکردن...');
 try{
  await loadPdf();const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;let done=0;
  for(const i of todo){
   if(job.cancel)break;
   busyMsg(`OCR: پەڕەی ${fa(i+1)} (${fa(done+1)} لە ${fa(todo.length)})`,done*100/todo.length);
   const p=await pdf.getPage(i+1),vp=p.getViewport({scale:1.6}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
   await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
   const data=cv.toDataURL('image/jpeg',.8).split(',')[1];
   const t=await gemini([{role:'user',parts:[{inlineData:{mimeType:'image/jpeg',data}},{text:'Transcribe ALL text on this page exactly as written (Kurdish Sorani / Arabic script / English / formulas). Keep line breaks. Output only the transcription, no comments. If the page has no text, output nothing.'}]}],{temp:0,maxTokens:8000});
   pages[i]=t.trim();done++;PG[b.id]=pages;await kvSet('pages:'+b.id,pages);
   if(done<todo.length)await sleep(4500);
  }
  b.chars=pages.reduce((a,t)=>a+t.length,0);b.empty=pages.filter(t=>t.length<25).length;save('books');busyOff();render();
  toast(`${fa(done)} پەڕە خوێندرانەوە.${b.empty>0?` ${fa(b.empty)} پەڕە ماون؛ دووبارە OCR بکە (هەر جارێک ١٥ پەڕە).`:''}`);
 }catch(e){busyOff();save('books');render();toast(e.message)}
};

A.startQuiz=async()=>{
 const c=U.qz;let list=[];
 if(c.mode==='ministry'){
  const pool=S.ministry.filter(q=>q.subject===c.subj&&(c.year==='all'||q.year===+c.year));
  if(!pool.length)return toast('هیچ پرسیارێکی وەزاری بۆ ئەم هەڵبژاردنە نییە.');
  list=pickUnseen(pool,c.count);
 }else if(c.mode==='saved'){
  const pool=S.aiq.filter(q=>q.subject===c.subj);
  if(!pool.length)return toast('هێشتا هیچ پرسیارێکی دروستکراو نییە. بە «پرسیاری نوێ بە AI» دروستیان بکە.');
  list=pickUnseen(pool,c.count);
 }else{
  busyOn('دەستپێکردن...');
  try{list=await genQuestions(c.subj,c.count,c)}catch(e){busyOff();return toast(e.message)}
  busyOff();if(!list.length)return toast('پرسیارێک دروست نەکرا. دووبارە هەوڵ بدەرەوە.');
 }
 if(list.length<c.count&&c.mode!=='ai')toast(`تەنها ${fa(list.length)} پرسیار هەیە.`);
 U.run={list,i:0,res:[],subj:c.subj,mode:c.mode,t0:Date.now(),sel:null,shown:false,done:false};render();
};
function recordAnswer(ok,q){
 const r=U.run;r.res.push({id:q.id,ok});S.seen[q.id]=Date.now();save('seen');
   if(CU)sb.from('seen_questions').upsert({question_id:q.id,user_id:CU.id}).then(()=>{});
 if(!ok)addWrong(q);else if(r.mode==='wrongs')delWrong(q.id);
}
A.pick=el=>{const r=U.run,q=r.list[r.i];if(r.sel!==null)return;r.sel=+el.dataset.i;recordAnswer(r.sel===q.answer,q);render()};
A.reveal=()=>{U.run.shown=true;render()};
A.selfGrade=el=>{const r=U.run,q=r.list[r.i];r.sel=+el.dataset.v;recordAnswer(r.sel===1,q);render()};
function finishRun(partial){
 const r=U.run;if(!r.res.length)return;
 logSession({kind:'quiz',subject:r.subj,total:r.res.length,correct:r.res.filter(x=>x.ok).length,secs:Math.min(Math.round((Date.now()-r.t0)/1000),2700)});
}
A.nextQ=()=>{const r=U.run;if(r.i+1<r.list.length){r.i++;r.sel=null;r.shown=false}else{r.done=true;finishRun()}render();$('#main').scrollTop=0};
A.quitRun=()=>{if(U.run.res.length&&!U.run.done){if(!confirm('کویزەکە دابخرێت؟ ئەو وەڵامانەی داتن تۆمار دەکرێن.'))return;finishRun()}U.run=null;render()};
A.newQuiz=()=>{U.run=null;render()};
A.retryBad=()=>{

A.startCards=async()=>{
 const c=U.fc;let list=[];const deck=S.decks[c.subj]||[];
 if(c.mode==='new'){
  busyOn('دەستپێکردن...');
  try{list=await genCards(c.subj,c.count,c)}catch(e){busyOff();return toast(e.message)}
  busyOff();if(!list.length)return toast('کارتێک دروست نەکرا. دووبارە هەوڵ بدەرەوە.');
 }else{
  const pool=c.mode==='hard'?deck.filter(d=>d.status==='learn'):deck;
  if(!pool.length)return toast(c.mode==='hard'?'هیچ کارتێکی «نەمزانیوە» نییە.':'هێشتا هیچ کارتێک نییە. سەرەتا کارتی نوێ دروست بکە.');
  const w={learn:0,new:1,know:2};
  list=shuffle(pool).sort((a,b)=>w[a.status]-w[b.status]).slice(0,c.count);
 }
 U.fr={list:shuffle(list),i:0,flip:false,res:{},subj:c.subj,t0:Date.now(),done:false};render();
};

A.send=async()=>{
 const inp=$('#ci'),t=inp.value.trim();if(!t||U.chat.busy)return;
 const s=U.chat.subj,h=S.chat[s]=S.chat[s]||[];
 h.push({r:'u',t});U.chat.busy=true;render();
 try{
  const ctx=await retrieve(s,t);
  const msgs=h.filter(m=>!m.err).slice(-10).map(m=>({role:m.r==='u'?'user':'model',parts:[{text:m.t}]}));
  msgs[msgs.length-1].parts[0].text=(ctx?'Relevant excerpts from the student\'s textbook:\n'+ctx+'\n\n':'')+'Student question: '+t;
  const out=await gemini(msgs,{system:`You are a patient tutor for a grade-12 student in the Kurdistan Region of Iraq, subject: ${sname(s)}. Always answer in Kurdish (Sorani, Arabic script), clearly and step by step, keeping scientific terms/formulas as in the textbook. When textbook excerpts are provided and relevant, base your answer on them and mention the page number. If the excerpts do not cover the question, say so and answer from general knowledge, marking it clearly. Never invent page numbers.`,temp:.4,maxTokens:4000});
  h.push({r:'m',t:out});
 }catch(e){h.push({r:'m',t:e.message,err:1})}
 if(h.length>40)h.splice(0,h.length-40);
 U.chat.busy=false;save('chat');render();
 const c=$('.cin');if(c)c.scrollIntoView({block:'end'});
};

A.authSubmit=async()=>{
 const e=$('#ae').value.trim(),pw=$('#ap').value,nm=$('#an')?.value.trim()||'';
 const err=t=>$('#aerr').textContent=t;
 if(!e||!pw)return err('ئیمەیل و پاسۆرد بنووسە.');
 if(pw.length<6)return err('پاسۆرد دەبێت کەمتر لە ٦ پیت نەبێت.');
 err('');busyOn(U._authMode==='login'?'داخلبوون...':'دروستکردنی هەژمار...');
 try{
  if(U._authMode==='login'){
   const {error}=await sb.auth.signInWithPassword({email:e,password:pw});
   if(error)throw error;
  } else {
   const {data,error}=await sb.auth.signUp({email:e,password:pw,options:{emailRedirectTo:null}});
   if(error)throw error;
   if(data.user){
    await sb.from('profiles').upsert({id:data.user.id,name:nm||''}).catch(()=>{});
    S.settings.name=nm;
    if(!data.session){busyOff();$('#aerr').style.color='var(--acc)';$('#aerr').textContent='هەژمارەکەت دروست کرا! ئیمەیلەکەت پشکنە و لینکی پشتراستکردن کلیک بکە.';return;}
   }
  }
  busyOff();
 } catch(er){busyOff();$('#aerr').textContent=er.message==='Invalid login credentials'?'ئیمەیل یان پاسۆرد هەڵەیە.':er.message==='User already registered'?'ئەم ئیمەیلە پێشتر تۆمار کراوە. داخل ببە.':er.message||'هەڵەیەک ڕوویدا.'}
};

A.resetCards=()=>{if(!confirm('هەموو کارتەکان دەگەڕێنەوە بۆ «نوێ». بەردەوام بم؟'))return;for(const k in S.decks)S.decks[k].forEach(d=>d.status='new');save('decks');toast('ئەنجام درا.')};
A.clearWrongs=()=>{if(!confirm('بانکی هەڵەکان پاک بکرێتەوە؟'))return;S.wrongs=[];save('wrongs');toast('پاک کرایەوە.')};
A.resetStats=()=>{if(!confirm('هەموو ئامار و تۆمارەکان دەسڕدرێنەوە. دڵنیایت؟'))return;S.sessions=[];save('sessions');toast('سڕایەوە.')};
A.hideAdmin=()=>{try{localStorage.removeItem('mk-admin')}catch{}side();go('dashboard')};
A.saveName=()=>{S.settings.name=$('#sn').value.trim();save('settings');toast('هەڵگیرا.')};
A.theme=el=>{S.settings.theme=el.dataset.v;save('settings');applyLook();render()};
A.size=el=>{S.settings.size=+el.dataset.v;save('settings');applyLook();render()};
A.saveKey=()=>{S.settings.apiKey=$('#sk').value.trim();S.settings.model=$('#sm').value.trim()||DEF.settings.model;save('settings');side();toast('هەڵگیرا.')};
A.listModels=async()=>{
 const k=$('#sk').value.trim();if(!k)return toast('سەرەتا کلیلەکە بنووسە.');
 S.settings.apiKey=k;save('settings');side();busyOn('پشکنین...');
 try{
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':k}});
  if(!r.ok)throw new Error(r.status===400||r.status===403?'کلیلەکە دروست نییە.':'هەڵە ('+r.status+')');
  const d=await r.json();
  U.models=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,'')).filter(n=>/gemini/i.test(n)&&!/image|tts|embed|live|audio/i.test(n));
  busyOff();render();toast(`کلیلەکە کار دەکات. ${fa(U.models.length)} مۆدێل دۆزرایەوە. ناوی مۆدێلەکە لە خانەی «مۆدێل» هەڵبژێرە.`);
 }catch(e){busyOff();toast(e.message==='Failed to fetch'?'پەیوەندی ئینتەرنێت نییە.':e.message)}
};
A.export=async()=>{
 busyOn('ئامادەکردنی باکئەپ...');
 const pages={};for(const b of S.books)pages[b.id]=await getPages(b.id);
 const {apiKey,...settings}=S.settings;
 const data={v:1,at:Date.now(),S:{...S,settings},pages};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
 a.download='mari-khwendin-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();busyOff();toast('باکئەپ دابەزی.');
};
async function doImport(f){
 try{
  const d=JSON.parse(await f.text());if(!d||d.v!==1||!d.S)throw 0;
  if(!confirm('داتای ئێستا بە داتای ئەم باکئەپە دەگۆڕدرێت. بەردەوام بم؟'))return;
  busyOn('هاوردەکردن...');
  const key=S.settings.apiKey;
  for(const k in DEF){S[k]=d.S[k]??structuredClone(DEF[k]);await kvSet(k,S[k])}
  S.settings={...DEF.settings,...S.settings,apiKey:key};await kvSet('settings',S.settings);
  for(const id in d.pages){PG[id]=d.pages[id];await kvSet('pages:'+id,d.pages[id])}
  busyOff();applyLook();side();render();toast('هاوردە کرا. (فایلی PDFی ئەسڵی ناگوازرێتەوە، بۆیە OCRی نوێ ناکرێت.)');
 }catch{busyOff();toast('ئەم فایلە باکئەپی دروست نییە.')}
}
A.wipe=async()=>{
 if(!confirm('هەموو داتاکان دەسڕدرێنەوە. دڵنیایت؟'))return;
 if(!confirm('ئەمە ناگەڕێتەوە. بەردەوام بم؟'))return;
 try{(await idb()).close()}catch{}
 indexedDB.deleteDatabase('mari-khwendin').onsuccess=()=>location.reload();
};

/* ============ ڕێگەدان و نیشاندان ============ */
function applyLook(){document.body.classList.toggle('light',S.settings.theme==='light');document.documentElement.style.setProperty('--fs',S.settings.size+'px');document.querySelector('meta[name=theme-color]').content=S.settings.theme==='light'?'#eef0f3':'#070709'}
function side(){
 const k=!!S.settings.apiKey,f=$('#sfoot');
 f.style.display='flex';
 $('#sdot').classList.toggle('on',k);
 $('#stxt').textContent=CU?(CU.email.split('@')[0]):'داخل نەبووە';
 // logout button
 let lb=$('#lob');
 if(!lb){lb=document.createElement('button');lb.id='lob';lb.className='btn bad sm';lb.textContent='دەرچوون';lb.dataset.a='logout';lb.style='margin-top:8px;width:100%';f.appendChild(lb)}
 lb.style.display=CU?'block':'none';
}
function adminCheck(){if(location.hash==='#admin'){try{localStorage.setItem('mk-admin','1')}catch{}toast('دۆخی بەڕێوەبەر کراوەیە.')}}
function go(t){if(t==='library'&&!isAdmin())t='dashboard';U.tab=t;document.body.classList.remove('menu');render();$('#main').scrollTop=0}
function render(){
 $('#nav').innerHTML=tabs().map(([id,l])=>`<button class="nb${U.tab===id?' on':''}" data-a="go" data-t="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[id]}"/></svg><span>${l}</span></button>`).join('');
 $('#ttl').textContent=(TABS.find(t=>t[0]===U.tab)||[])[1]||'';
 const keep=$('#ci')?$('#ci').value:'';
 $('#view').innerHTML=V[U.tab]();
 if(keep&&$('#ci'))$('#ci').value=keep;
 tUI();
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a;if(a==='closeModal'&&e.target!==el&&!e.target.closest('button[data-a=closeModal]'))return;
 if(A[a])Promise.resolve(A[a](el,e)).catch(err=>{busyOff();toast(err&&err.message||'هەڵەیەک ڕوویدا')});
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='imp'&&el.files[0]){doImport(el.files[0]);el.value='';return}
 const c=el.closest('[data-c]');if(!c)return;
 const[o,k]=c.dataset.c.split('.');
 const v=c.type==='number'?(c.value===''?'':+c.value):c.value;
 if(o==='T'){T[k]=v;return}
 U[o][k]=v;
 if(c.dataset.r)render();
});
document.addEventListener('keydown',e=>{if(e.target.id==='ci'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();A.send()}});

(async()=>{
 await load();adminCheck();applyLook();
 await initAuth();
 if(!CU){go('auth');render()}else{await loadCloudData();side();render()}
 addEventListener('hashchange',()=>{adminCheck();side();render()});
})();
</script>
</body>
